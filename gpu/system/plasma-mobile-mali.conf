# Drop-in for plasma-mobile.service: run the desktop on the vendor driver.
#
# The shim has to occupy the libEGL.so.1 slot rather than be preloaded, because
# libepoxy dlopens that name and resolves against the handle. Preloading the
# driver itself is still needed: musl only grants initial-exec TLS to libraries
# present at startup.
[Service]
Environment=LD_LIBRARY_PATH=/opt/gcompat/lib:/opt/mali/egl:/opt/mali/lib
Environment="LD_PRELOAD=/opt/mali/lib/mali-shim.so /opt/mali/lib/libmali.so"
# KWin 6.6 accepts only O2 and O2ES here; anything else makes it drop to
# software after a successful backend init, without saying so.
Environment=KWIN_COMPOSE=O2ES
